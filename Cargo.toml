[package]
name = "codex-statusline"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/adithya-n05/codex-statusline"
publish = false

[dependencies]
rusqlite = "0.37"
serde_json = "1"
time = { version = "0.3.55", default-features = false, features = ["parsing"] }
unicode-linebreak = "0.1"
unicode-segmentation = "1"
[dev-dependencies]
libtest-mimic = "0.8"
portable-pty = "0.9"
tempfile = "3"
vt100 = "0.16"

[[test]]
name = "host"
path = "tests/host/main.rs"
harness = false
