name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Isolate development tools in the checkout
        run: |
          echo "CARGO_HOME=$PWD/.tools/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$PWD/.tools/rustup" >> "$GITHUB_ENV"
          echo "npm_config_cache=$PWD/.tools/npm-cache" >> "$GITHUB_ENV"
          echo "$PWD/.tools/cargo/bin" >> "$GITHUB_PATH"
      - name: Set up the Rust checks
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy,llvm-tools-preview --no-self-update
          cargo install cargo-llvm-cov --version 0.9.2 --locked
      - name: Install Codex for terminal tests
        run: |
          npm install --prefix "$PWD/.tools/codex-cli" @openai/codex@0.172.0
          echo "$PWD/.tools/codex-cli/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Verify
        run: |
          codex --version
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked --no-fail-fast
          cargo coverage
          cargo build --release --locked
